<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

</head><body><div id="app"><p style="padding:30px">Loading…</p></div>
<script src="assets/engine.js"></script><script src="assets/kit.js"></script><script src="assets/data.js"></script>
<script>
(function(){
  var id=new URLSearchParams(location.search).get('id');
  function load(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('Cannot load '+src))};document.head.appendChild(s);});}
  if(!id){document.getElementById('app').textContent='No lab selected.';return;}
  load('labs/'+id+'.js?v='+Course.version).then(function(){
    var d=Course.lectures[id]; var need=(d&&d.widgets)||[];
    return need.reduce(function(p,w){return p.then(function(){return load('assets/widgets/'+w+'.js?v='+Course.version);});},Promise.resolve());
  }).then(function(){return Course.mount(id);}).catch(function(e){document.getElementById('app').innerHTML='<p style="padding:30px">Could not open this page: '+e.message+'. <a href="./">Back to the course</a></p>';});
})();
</script></body></html>
